[project]
name = "drums-tabs"
version = "0.1.0"
description = "Drum practice player: hand-authored MIDI notation synced over the record"
requires-python = ">=3.11,<3.12"
dependencies = [
    "librosa>=0.10",
    "scipy>=1.11",
    "numpy>=1.26",
    "soundfile>=0.12",
    "mido>=1.3",
    "typer>=0.12",
    "rich>=13.0",
    "matplotlib>=3.8",
    "dawdreamer>=0.9.0",
]

[project.scripts]
drums = "pipeline.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
