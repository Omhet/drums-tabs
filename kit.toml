# Your kit: where everything is, and what it costs to play it.
#
# This is a property of you and your kit, not of a song, so it lives here at
# the repo root rather than in any songs/<slug>/song.toml. `drums sticking`
# reads it to work out which hand plays what -- it only ever needs *relative*
# distances (is the ride further from the snare than the hi-hat is), so rough
# numbers are enough to get R and L right. Precision starts to matter only when
# a 3D stick has to visibly land on a drum, which is a later milestone; the
# body measurements and camera shots that milestone needs will arrive here too.
#
# Positions are in centimetres, looking down on the kit: the origin is the
# centre of the kick drum, +x is to your right, +y is away from the stool. The
# heights are not modelled -- from above, a cymbal and a drum are both a place
# to put a stick.
#
# `limbs` says who can reach it. Everything a hand can play is left to the
# solver; the two pedals are a lookup, not a search.

[instrument.kick]
pos = [0, 0]
limbs = ["right_foot"]

[instrument.hihat_pedal]
pos = [-50, -10]
limbs = ["left_foot"]

[instrument.snare]
pos = [-25, -15]
limbs = ["left_hand", "right_hand"]

# The same drum, so the same place: a hand going to a cross-stick has travelled
# exactly as far as a hand going to the snare, which is all the solver asks.
# It is a separate instrument because it is a separate thing to play, not
# because it is somewhere else.
[instrument.sidestick]
pos = [-25, -15]
limbs = ["left_hand", "right_hand"]

[instrument.hihat_closed]
pos = [-50, -10]
limbs = ["left_hand", "right_hand"]

[instrument.hihat_open]
pos = [-50, -10]
limbs = ["left_hand", "right_hand"]

[instrument.tom_high]
pos = [-15, 25]
limbs = ["left_hand", "right_hand"]

[instrument.tom_mid]
pos = [15, 25]
limbs = ["left_hand", "right_hand"]

[instrument.tom_floor]
pos = [45, 5]
limbs = ["left_hand", "right_hand"]

[instrument.ride]
pos = [50, 20]
limbs = ["left_hand", "right_hand"]

[instrument.crash]
pos = [-45, 35]
limbs = ["left_hand", "right_hand"]

[instrument.crash2]
pos = [35, 40]
limbs = ["left_hand", "right_hand"]

# What "effort" means. There is one hard rule -- a hand cannot move faster than
# `max_speed_cm_s`, and a passage needing more is reported as unplayable rather
# than played badly -- and three preferences, which are taste and are meant to
# be tuned. Read the R and L letters under the notation, ask whether that is
# what you would play, and change a number here. Nothing needs rebuilding; just
# re-run `drums sticking --restick`.
#
# These first numbers were picked to be plausible and then tuned against one
# song, so treat them as a starting point rather than as settled.
[hands]
# Hard: the fastest a hand can travel between two instruments.
max_speed_cm_s = 700

# Which hand keeps time. On a right-handed kit the hi-hat is on your left and
# the right hand crosses over to reach it -- that is not a crossing to avoid,
# it is how the kit is played, so the lead hand is the one that gets the
# instruments marked `time_keeper` (the hats and the ride, unless you say
# otherwise) and the other hand gets the snare under it.
lead = "right"
# Soft: the cost of the other hand taking a time-keeper instead. High enough
# that grooves come out conventional, low enough that a fill can borrow it.
lead_bias = 2.5

# Soft: how much a rushed move costs, as a fraction of the speed limit used.
travel = 1.0
# Soft: the hands ending up on the wrong sides of each other, away from the
# time-keepers -- crossing over to the hats does not count, see `lead`.
crossover = 2.0
# Soft: the same hand twice in a row when there is no time for it. Fills
# alternate because one hand cannot keep up, and this is what makes the solver
# alternate too.
repeat = 1.5
# "No time for it" means a gap shorter than this.
repeat_below_ms = 260

# What your module sends, and which instrument each note means.
#
# This is one of **four** tables that all read "MIDI note -> instrument" and all
# disagree about almost every number, so name the one you mean:
#
#   `[midi_map]` in a song.toml   the drum rack in Ableton the notation is
#                                 authored on -- chromatic from 36, so 38 is
#                                 the hi-hat
#   `[input.note]`, here          the module you actually hit, which sends
#                                 Roland's layout, where 38 is the snare head
#   `[render.articulation]`,      the sampler plugin a kit is rendered from,
#   here                          which listens on a layout of its own again
#   alphaTab's articulation       a per-score index that is none of the above
#   index                         (app/src/midi-tab.ts)
#
# Nothing translates between them: a take stores the raw numbers the module
# sent, and this table is what reads them as instruments for scoring.
#
# The numbers below are Roland's factory layout, shared by the TD-17/27/50.
# Do not trust them -- the practice panel lists every note it receives and
# says which are unmapped, so hit each pad once and fix whatever is wrong.
# Several notes map to one instrument on purpose: a rim shot and a head hit are
# both the snare as far as the chart is concerned, and the notation has no way
# to write the difference. A **cross-stick is not one of them** -- the staff has
# a notehead for it and One For The Road is written with it, so note 37 reads as
# `sidestick` and playing an ordinary backbeat where one is written counts as
# the wrong drum. That is deliberate: it is a different thing to play. The two
# are also *not* in `same_drum` below, because nothing here flickers -- you
# choose a cross-stick and the module reports it, where an open or closed hat
# is a threshold you did not set.
[input]
# Which MIDI port to open, matched as a case-insensitive substring of the
# port name. Empty means "ask", and the choice is remembered per browser.
port = "TD-27"

# One drum caught in two states, not two drums.
#
# A hi-hat module decides "open" or "closed" from where your foot is at the
# instant of the strike, and the threshold rarely matches where *you* think
# closed is -- so a normal closed groove sends a mixture. Scored literally that
# is a wrong note on every flicker, which buries the mistakes you actually
# made. Listed here, the pair is matched as one drum: you hit the right thing
# at the right time, and the report says separately how many landed on the
# other side of the threshold.
#
# This is not a way to excuse wrong drums. A tom where a snare is written stays
# wrong; only states of the same instrument belong here.
same_drum = [["hihat_closed", "hihat_open"]]

[input.note]
36 = "kick"           # kick
35 = "kick"           # kick, alternate

38 = "snare"          # snare head
40 = "snare"          # snare rim shot
37 = "sidestick"      # snare cross-stick -- its own instrument, see below

48 = "tom_high"       # tom 1 head
50 = "tom_high"       # tom 1 rim
45 = "tom_mid"        # tom 2 head
47 = "tom_mid"        # tom 2 rim
43 = "tom_floor"      # tom 3 head
58 = "tom_floor"      # tom 3 rim

42 = "hihat_closed"   # hi-hat bow, pedal down
22 = "hihat_closed"   # hi-hat edge, pedal down
46 = "hihat_open"     # hi-hat bow, pedal up
26 = "hihat_open"     # hi-hat edge, pedal up
44 = "hihat_pedal"    # hi-hat pedal, closed with the foot
21 = "hihat_pedal"    # hi-hat pedal splash

49 = "crash"          # crash 1 bow
55 = "crash"          # crash 1 edge
57 = "crash2"         # crash 2 bow
52 = "crash2"         # crash 2 edge

51 = "ride"           # ride bow
59 = "ride"           # ride edge
53 = "ride"           # ride bell

# What your kit sounds like, and where those sounds come from.
#
# `kit/samples/` is a bank of one-shots rendered out of a drum plugin you own
# -- Superior Drummer 3 by default -- by `drums kit-bake`, which hosts the
# plugin headless, plays it the notes described below, and slices the result.
# Nothing here is committed: the bank is rebuilt from software on this machine,
# and `kit/` is ignored for exactly that reason.
#
# **The bank is keyed by articulation, not by instrument.** Everywhere else in
# the project an instrument *is* the identity -- a chart cannot say "snare, but
# struck on the rim", and `kit.toml`'s own `[input.note]` folds a rim shot into
# `snare` on purpose. The sampler is the one place that can afford to know the
# difference, so it is built knowing it: each articulation names the instrument
# it sounds for, and one per instrument is the `default` that gets picked when
# nothing asks for anything else. Today every instrument has exactly one and
# nothing downstream can tell. When the notation, `[midi_map]`, `[input.note]`,
# the sticking solver and the scorer eventually learn a rim shot -- which is
# the expensive half, and all of it has to move at once -- the sampler will
# already be waiting, and adding it here is three lines and a `--only` re-bake.
[render]
# The drum plugin to render from. `drums kit-bake` hosts it headless -- no DAW
# is opened and no audio device is touched -- so this is a path on this machine
# in the same way `[input] port` is a socket on this machine. Addictive Drums 2
# is installed too and works the same way if SD3 ever misbehaves offline:
# `drums kit-bake --plugin "C:/Program Files/Common Files/VST3/Addictive Drums 2.vst3"`.
plugin = "C:/Program Files/Common Files/VST3/Toontrack/Superior Drummer 3.vst3"

# Defaults. Any [render.articulation.*] may override them.
layers = 6            # velocity layers: how many different strikes are sampled
round_robin = 4       # takes per layer, so the same note twice is two recordings
tail_s = 2.0          # how much of the decay to keep, in seconds
stereo = false        # fold to mono unless the ambience is the point
# The velocities the layers are spread across. Not 1..127: the charts on disk
# live between 50 and 102, and two notes in three are exactly 100, so layers
# spread over the full range would put most of themselves where nothing lands.
# Widen this as the Ableton authoring gets more dynamic.
velocity_low = 20
velocity_high = 120

# On `tail_s`: these are longer than a dry sample would need, because what is
# rendered is the plugin's *mixer* output -- room and overheads included -- and
# a room rings for a good while after the drum has stopped. The first guesses
# were made from dry lengths and cut a closed hi-hat off at -19 dB, which is
# not a tail, it is the sound. `drums kit-bake` prints the longest sample per
# articulation; when that number is exactly `tail_s`, the cut is arbitrary and
# the real decay is longer than this.

# Which note the plugin listens on. These are Superior Drummer 3's defaults,
# which are broadly Roland/GM -- but a kit that maps something differently
# shows up in `drums kit-bake`'s report as the wrong length or the wrong peak
# (a "crash" lasting 0.4 s is not a crash), and the fix is one number here.
# `drums kit-bake --audition` writes one labelled wav per articulation when the
# numbers are not enough and you need to hear it.

[render.articulation.kick]
instrument = "kick"
default = true
note = 36
tail_s = 1.0

[render.articulation.snare]
instrument = "snare"
default = true
note = 38
# The most layers of anything: the snare is where the dynamics live. A ghost
# note and a backbeat are different strikes, not one strike at two volumes,
# and this is the drum where hearing that matters most.
layers = 10
tail_s = 1.4

[render.articulation.sidestick]
instrument = "sidestick"
default = true
note = 37
layers = 3
tail_s = 0.6

[render.articulation.hihat_closed]
instrument = "hihat_closed"
default = true
note = 42
layers = 8
tail_s = 1.5

[render.articulation.hihat_open]
instrument = "hihat_open"
default = true
note = 46
layers = 6
round_robin = 3
tail_s = 2.5
stereo = true
# Rings long enough to still be sounding when the next hat lands, so it is the
# one that gets cut short -- see [sampler] choke below.
ring = true

[render.articulation.hihat_pedal]
instrument = "hihat_pedal"
default = true
note = 44
layers = 3
round_robin = 3
tail_s = 1.0

[render.articulation.tom_high]
instrument = "tom_high"
default = true
note = 48
tail_s = 1.8

[render.articulation.tom_mid]
instrument = "tom_mid"
default = true
note = 45
tail_s = 2.2

[render.articulation.tom_floor]
instrument = "tom_floor"
default = true
note = 43
tail_s = 2.5

[render.articulation.ride]
instrument = "ride"
default = true
note = 51
tail_s = 3.5
stereo = true

[render.articulation.crash]
instrument = "crash"
default = true
note = 49
layers = 4
round_robin = 3
tail_s = 3.5
stereo = true

[render.articulation.crash2]
instrument = "crash2"
default = true
note = 57
layers = 4
round_robin = 3
tail_s = 3.5
stereo = true

# Not rendered, and here as a worked example of what "the sampler is already
# waiting" means. Uncomment, run `drums kit-bake --only snare_rimshot`, and the
# bank has it in about a minute -- no format change, nothing else re-rendered.
# It will not *sound* until the notation can write one, which is the other and
# much larger half of the job.
#
# [render.articulation.snare_rimshot]
# instrument = "snare"
# note = 40
#
# Others already sitting in [input.note] as notes that currently collapse:
# ride bell (53), ride edge (59), crash edge (55 and 52), the tom rims
# (50, 47, 58) and the hi-hat foot splash (21).

# How the bank is played, as opposed to how it was made.
#
# This is taste, so it lives here in the file you author rather than in
# `kit/kit.lock.json`, which `drums kit-bake` overwrites every time it runs.
[sampler]
# A hit on any member of a group cuts short a member of the same group that is
# still sounding -- but only one marked `ring`, above. A closed hi-hat is half
# a second long and dies on its own, and cutting those off too sounds tighter
# than any drummer plays. An open hat sings through the whole bar, and *that*
# is the giveaway that nobody is actually sitting at the kit.
choke = [["hihat_closed", "hihat_open", "hihat_pedal"]]

# Per-instrument trim in dB, for when a drum comes out louder than you want it.
# The render already carries the plugin's own balance, so this should stay
# small; reach for it when the hats are wearing you out, not to remix the kit.
[sampler.trim]
