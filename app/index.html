<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>drums-tabs</title>
    <!-- No icon file; without this the browser asks for /favicon.ico and logs a 404 on every load. -->
    <link rel="icon" href="data:," />
    <!-- Apply the saved theme before first paint so the page does not flash. -->
    <script>
      try {
        const t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <style>
      /* Light is the base. Dark applies when chosen with the switch, or when
         the system prefers it and nothing was chosen. */
      :root {
        color-scheme: light;
        --bg: #f7f7f8;
        --fg: #1a1a1c;
        --muted: #6b6b73;
        --panel: #ffffff;
        --border: #e2e2e6;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #17171a;
        --fg: #ececf0;
        --muted: #9a9aa4;
        --panel: #1f1f24;
        --border: #303038;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --bg: #17171a;
          --fg: #ececf0;
          --muted: #9a9aa4;
          --panel: #1f1f24;
          --border: #303038;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      /* Bottom padding clears the pinned status line. */
      main { max-width: 1100px; margin: 0 auto; padding: 24px 20px 72px; }
      .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      .sub { color: var(--muted); margin: 0 0 20px; }
      #theme { padding: 4px 10px; font-size: 16px; line-height: 1; }
      .controls {
        display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
        padding: 12px 14px; margin-bottom: 16px;
        background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      }
      select {
        font: inherit; padding: 5px 8px; border-radius: 6px;
        border: 1px solid var(--border); background: var(--panel); color: var(--fg);
        max-width: 22em;
      }
      button {
        font: inherit; padding: 6px 14px; border-radius: 6px;
        border: 1px solid var(--border); background: var(--panel); color: var(--fg);
        cursor: pointer;
      }
      button:hover:not(:disabled) { border-color: var(--muted); }
      button:disabled { opacity: 0.5; cursor: default; }
      label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
      output { color: var(--fg); font-variant-numeric: tabular-nums; min-width: 3.5em; }
      #video {
        display: block; width: 100%; max-height: 380px; margin-bottom: 16px;
        background: #000; border-radius: 8px; cursor: pointer;
      }
      /* The score's own scroll box: the cursor is followed in here, the video
         stays. It wraps alphaTab's element rather than being it, because
         alphaTab measures the scroll target from its element's position
         inside the box, which only works when the element itself moves. */
      #score-box {
        background: var(--panel); border: 1px solid var(--border);
        border-radius: 8px; padding: 8px; overflow: auto; height: 46vh; min-height: 280px;
      }
      /* Pinned bottom right so it is readable without scrolling for it. */
      #status {
        position: fixed; right: 16px; bottom: 12px; z-index: 10;
        max-width: min(60vw, 640px); margin: 0; padding: 6px 12px;
        color: var(--muted); font-size: 13px; line-height: 1.4;
        background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      }
      /* alphaTab creates the cursor elements but leaves them unstyled. */
      .at-cursor-bar { background: rgba(255, 200, 0, 0.18); }
      .at-cursor-beat { background: rgba(230, 60, 60, 0.85); width: 3px; }
      .at-highlight * { fill: #d33; stroke: #d33; }
    </style>
  </head>
  <body>
    <main>
      <div class="top">
        <div>
          <h1>drums-tabs</h1>
          <p class="sub">Notation from <code>songs/&lt;slug&gt;/tab.mid</code> over the cover video, synced to the drummer. Space plays, click the score to seek.</p>
        </div>
        <button id="theme" title="Switch theme" aria-label="Switch theme"></button>
      </div>
      <div class="controls">
        <label>
          Song
          <select id="song"></select>
        </label>
        <button id="play" disabled>Play</button>
        <button id="stop" disabled>Stop</button>
        <label>
          Tempo
          <input id="speed" type="range" min="25" max="125" value="100" step="5" />
          <output id="speed-out">100%</output>
        </label>
      </div>
      <video id="video" playsinline preload="auto"></video>
      <div id="score-box"><div id="score"></div></div>
      <p id="status">Loading alphaTab&hellip;</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
