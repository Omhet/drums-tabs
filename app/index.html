<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>drums-tabs</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f7f8;
        --fg: #1a1a1c;
        --muted: #6b6b73;
        --panel: #ffffff;
        --border: #e2e2e6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17171a;
          --fg: #ececf0;
          --muted: #9a9aa4;
          --panel: #1f1f24;
          --border: #303038;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 1100px; margin: 0 auto; padding: 24px 20px 64px; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      .sub { color: var(--muted); margin: 0 0 20px; }
      .controls {
        display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
        padding: 12px 14px; margin-bottom: 16px;
        background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      }
      select {
        font: inherit; padding: 5px 8px; border-radius: 6px;
        border: 1px solid var(--border); background: var(--panel); color: var(--fg);
        max-width: 22em;
      }
      button {
        font: inherit; padding: 6px 14px; border-radius: 6px;
        border: 1px solid var(--border); background: var(--panel); color: var(--fg);
        cursor: pointer;
      }
      button:hover:not(:disabled) { border-color: var(--muted); }
      button:disabled { opacity: 0.5; cursor: default; }
      label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
      output { color: var(--fg); font-variant-numeric: tabular-nums; min-width: 3.5em; }
      #score {
        background: var(--panel); border: 1px solid var(--border);
        border-radius: 8px; padding: 8px; overflow-x: auto;
      }
      #status { color: var(--muted); margin-top: 12px; }
      /* alphaTab creates the cursor elements but leaves them unstyled. */
      .at-cursor-bar { background: rgba(255, 200, 0, 0.18); }
      .at-cursor-beat { background: rgba(230, 60, 60, 0.85); width: 3px; }
      .at-highlight * { fill: #d33; stroke: #d33; }
    </style>
  </head>
  <body>
    <main>
      <h1>drums-tabs</h1>
      <p class="sub">Phase 1b &mdash; transcriptions from <code>songs/&lt;slug&gt;/song.alphatex</code>, reloaded when the file changes.</p>
      <div class="controls">
        <label>
          Song
          <select id="song"></select>
        </label>
        <button id="play" disabled>Play</button>
        <button id="stop" disabled>Stop</button>
        <label>
          Tempo
          <input id="speed" type="range" min="25" max="125" value="100" step="5" />
          <output id="speed-out">100%</output>
        </label>
        <label>
          Metronome
          <input id="metronome" type="range" min="0" max="100" value="0" step="5" />
          <output id="metronome-out">off</output>
        </label>
      </div>
      <div id="score"></div>
      <p id="status">Loading alphaTab&hellip;</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
