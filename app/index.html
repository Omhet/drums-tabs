<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>drums-tabs</title>
    <!-- No icon file; without this the browser asks for /favicon.ico and logs a 404 on every load. -->
    <link rel="icon" href="data:," />
    <!-- Apply the saved theme before first paint so the page does not flash. -->
    <script>
      try {
        const t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <style>
      /* Light is the base. Dark applies when chosen with the switch, or when
         the system prefers it and nothing was chosen. --glass is the notation
         window's panel over the video: translucent, so the video shows
         through, but opaque enough for the notes to read on it. */
      :root {
        color-scheme: light;
        --bg: #f7f7f8;
        --fg: #1a1a1c;
        --muted: #6b6b73;
        --panel: #ffffff;
        --glass: rgba(255, 255, 255, 0.86);
        --border: #e2e2e6;
        /* The routine grid's two verdicts, matching the heatmap's `tight` and
           `missed` so a green cell and a green notehead mean the same thing. */
        --pass: #208c4e;
        --warn: #c87814;
        --fail: #c82d28;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #17171a;
        --fg: #ececf0;
        --muted: #9a9aa4;
        --panel: #1f1f24;
        --glass: rgba(23, 23, 26, 0.84);
        --border: #303038;
        --pass: #50c882;
        --warn: #f0af50;
        --fail: #f56e64;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --bg: #17171a;
          --fg: #ececf0;
          --muted: #9a9aa4;
          --panel: #1f1f24;
          --glass: rgba(23, 23, 26, 0.84);
          --border: #303038;
          --pass: #50c882;
          --warn: #f0af50;
          --fail: #f56e64;
        }
      }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      /* One screen: the header and controls take what they need and the stage
         (video + notation) gets the rest. `overflow-y: auto` is a safety valve,
         not the normal case -- on a short window the routine grid, the stage
         and a take's reading together want more than there is, and something
         being unreachable is worse than a scrollbar that is usually absent. */
      main {
        box-sizing: border-box; height: 100%; max-width: 1400px; margin: 0 auto;
        padding: 14px 20px 10px; display: flex; flex-direction: column;
        overflow-y: auto;
      }
      .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
      h1 { font-size: 18px; margin: 0 0 2px; }
      .sub { color: var(--muted); margin: 0 0 12px; }
      .sub kbd {
        font: inherit; padding: 0 5px; border: 1px solid var(--border); border-radius: 4px;
        background: var(--panel); color: var(--fg);
      }
      #theme { padding: 4px 10px; font-size: 16px; line-height: 1; }
      .controls {
        display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
        padding: 10px 14px; margin-bottom: 12px;
        background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      }
      select {
        font: inherit; padding: 5px 8px; border-radius: 6px;
        border: 1px solid var(--border); background: var(--panel); color: var(--fg);
        max-width: 22em;
      }
      button {
        font: inherit; padding: 6px 14px; border-radius: 6px;
        border: 1px solid var(--border); background: var(--panel); color: var(--fg);
        cursor: pointer;
      }
      button:hover:not(:disabled) { border-color: var(--muted); }
      button:disabled { opacity: 0.5; cursor: default; }
      label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
      output { color: var(--fg); font-variant-numeric: tabular-nums; min-width: 3.5em; }
      .mixer {
        display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
        padding-left: 16px; border-left: 1px solid var(--border);
      }
      .mixer input[type="range"] { width: 90px; }
      /* The stage: the picture fills it, the notation window sits over the
         bottom of it. A song with no video bound to its timeline has no
         picture, and then the notation is the stage (#stage.no-video). */
      #stage {
        position: relative; flex: 1; min-height: 240px;
        background: #000; border-radius: 8px; overflow: hidden;
      }
      #video {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: contain; cursor: pointer;
      }
      #stage.no-video { background: var(--panel); border: 1px solid var(--border); }
      #stage.no-video #video { display: none; }
      /* Nothing behind it to see through, so no glass and no blur -- and no
         picture to sit over, so the notation starts at the top of the stage
         instead of hanging off the bottom of it. */
      #stage.no-video #score-box {
        top: 0; bottom: auto;
        background: none; backdrop-filter: none; -webkit-backdrop-filter: none;
      }
      /* The Lines control set to Fill: the notation takes the whole stage
         instead of N rows over the bottom of it (score-window.ts). */
      #stage.no-video #score-box.fit,
      #score-box.fit { top: 0; bottom: 0; height: auto; }
      /* The notation window: N lines of the score (score-window.ts sets the
         height), scrolled a whole line at a time so the line being played is
         the top one. It wraps alphaTab's element rather than being it: the
         element keeps its full height and the box clips it. */
      #score-box {
        position: absolute; left: 0; right: 0; bottom: 0; height: 260px;
        padding: 0 8px; overflow: hidden;
        background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      }
      #status {
        margin: 8px 0 0; color: var(--muted); font-size: 12px; line-height: 1.4;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      /* The sticking letters (sticking.ts): one per beat the hands play,
         placed under the staff from alphaTab's own bounds. The overlay is
         inside alphaTab's element so it scrolls with the score; each letter is
         centred on the beat it belongs to. */
      #score { position: relative; }
      .sticking span {
        position: absolute; transform: translateX(-50%);
        font: 600 11px/1 ui-monospace, "Cascadia Mono", Consolas, monospace;
        color: var(--muted); pointer-events: none; white-space: nowrap;
      }
      /* --- practice mode ------------------------------------------------ */
      .practice { margin-top: -6px; }
      .grow { flex: 1; }
      #record[data-armed="1"] { border-color: #d33; color: #d33; font-weight: 600; }
      /* The monitor: the last few hits as they arrive, newest on the right.
         It is the fastest way to find out what a pad actually sends, so an
         unmapped note is the thing it shows loudest. */
      #monitor {
        display: flex; gap: 6px; overflow: hidden; margin: 0 0 10px;
        font: 11px/1.6 ui-monospace, "Cascadia Mono", Consolas, monospace;
      }
      #monitor span {
        padding: 1px 7px; border-radius: 4px; white-space: nowrap;
        background: var(--panel); border: 1px solid var(--border); color: var(--muted);
      }
      #monitor span b { color: var(--fg); font-weight: 600; }
      #monitor span.unmapped { border-color: #d33; color: #d33; }
      #monitor span.unmapped b { color: #d33; }
      /* The routine grid (routine.ts): rows are sections, columns the tempo
         ladder, and the last row is the whole song. The same shape every run,
         forever -- that is what makes two runs comparable at all. A filled cell
         shows its accuracy and goes green or red; red is a signal and not a
         gate, so it is not in the way of anything. */
      #routine { margin: -4px 0 10px; font-size: 12px; }
      #routine table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
      #routine th {
        padding: 0 10px 0 0; text-align: left; font-weight: normal; color: var(--muted);
        white-space: nowrap;
      }
      #routine thead th { text-align: center; padding: 0 0 2px; }
      #routine td { padding: 0 3px 1px 0; }
      #routine .cell {
        width: 54px; padding: 1px 0; font: inherit; line-height: 1.25; text-align: center;
        border-radius: 5px; border: 1px solid var(--border);
        background: var(--panel); color: var(--muted); cursor: pointer;
      }
      #routine .cell.pass { border-color: var(--pass); color: var(--pass); }
      #routine .cell.fail { border-color: var(--fail); color: var(--fail); }
      /* Where you are. An outline rather than a fill, so it reads on top of
         whichever of the three states the cell is already in. */
      #routine .cell.at { outline: 2px solid var(--fg); outline-offset: 1px; color: var(--fg); }
      #routine tr.whole th, #routine tr.whole .cell { font-weight: 600; }
      #routine tr.whole td { padding-top: 5px; }
      #routine tr.whole th { padding-top: 5px; color: var(--fg); }
      #routine .note { margin: 6px 0 0; color: var(--muted); max-width: 70ch; }
      /* The trend column: one line per section across the sealed runs, oldest
         on the left, smoothed as a median of the last three (routine.ts). The
         scale is a fixed 0-100% with the pass threshold dotted on it, so two
         rows can be compared by eye -- a line that rescaled to its own range
         would make every section look equally close to done. */
      #routine th.trend-head { text-align: center; color: var(--muted); font-size: 11px; }
      #routine td.trend { padding-left: 10px; line-height: 0; }
      #routine td.trend svg { overflow: visible; }
      #routine td.trend .pass-line {
        stroke: var(--border); stroke-width: 1; stroke-dasharray: 2 2;
      }
      #routine td.trend .line { fill: none; stroke-width: 1.5; stroke-linejoin: round; }
      #routine td.trend.pass .line, #routine td.trend.pass .dot { stroke: var(--pass); fill: var(--pass); }
      #routine td.trend.fail .line, #routine td.trend.fail .dot { stroke: var(--fail); fill: var(--fail); }
      #routine td.trend .line { fill: none; }
      #routine .note.warn { color: var(--fail); }
      /* The reading after a take (practice.ts drawReport): three dials, a map
         of the bars, then the numbers folded away. Each dial answers exactly
         one question and they are never blended into a score -- consistently
         late is the audio path or the song's feel, randomly late is the
         playing, and averaging them sends you to practise the wrong thing
         (practice-plan Q7). */
      #report {
        margin: 10px 0 0; padding: 12px 14px; font-size: 12px;
        background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      }
      #report .dials { display: flex; gap: 30px; flex-wrap: wrap; }
      .dial { display: flex; flex-direction: column; gap: 1px; min-width: 118px; cursor: help; }
      .dial .label {
        font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted);
      }
      .dial .big {
        font-size: 21px; line-height: 1.2; font-weight: 600; font-variant-numeric: tabular-nums;
      }
      .dial .sub { color: var(--muted); }
      .dial.good .big { color: var(--pass); }
      .dial.ok .big { color: var(--warn); }
      .dial.bad .big { color: var(--fail); }
      /* The Feel needle: rushing to the left, dragging to the right, and the
         centre mark is where the record's own drummer sits -- not where the
         written grid is (reference.ts). A position reads at a glance; the
         signed number underneath is for when you want it. */
      .dial .needle {
        position: relative; display: block; height: 4px; margin: 5px 0 3px;
        border-radius: 2px; background: var(--border);
      }
      .dial .needle::before {
        content: ""; position: absolute; left: 50%; top: -2px;
        width: 1px; height: 8px; background: var(--muted);
      }
      .dial .needle i {
        position: absolute; top: -3px; width: 3px; height: 10px;
        border-radius: 2px; transform: translateX(-50%); background: var(--muted);
      }
      .dial.good .needle i { background: var(--pass); }
      .dial.ok .needle i { background: var(--warn); }
      .dial.bad .needle i { background: var(--fail); }
      /* The bar strip: one block per bar of the cell, coloured by whether the
         notes landed -- the same question the noteheads answer. A bad bar is
         filled rather than outlined so it is the thing you see first. Click a
         block to put the cursor on that bar. */
      #report .strip { display: flex; flex-wrap: wrap; gap: 3px; margin: 13px 0 0; }
      #report .bar {
        min-width: 27px; padding: 2px 3px; font: inherit; font-size: 11px;
        font-variant-numeric: tabular-nums; text-align: center; border-radius: 4px;
        border: 1px solid var(--border); background: var(--panel);
        color: var(--muted); cursor: pointer;
      }
      #report .bar.good { border-color: var(--pass); color: var(--pass); }
      #report .bar.ok { border-color: var(--warn); color: var(--warn); }
      #report .bar.bad { border-color: var(--fail); background: var(--fail); color: var(--panel); }
      #report .bar.none { opacity: 0.4; }
      #report .again { margin: 11px 0 0; font-weight: 600; }
      #report details { margin: 10px 0 0; }
      #report summary { cursor: pointer; color: var(--muted); }
      #report table {
        border-collapse: collapse; font-variant-numeric: tabular-nums; margin: 7px 0 0;
      }
      #report th, #report td { padding: 1px 12px 1px 0; text-align: left; font-weight: normal; }
      #report th { color: var(--muted); }
      #report td.num { text-align: right; padding-right: 18px; }
      #report .note { margin: 7px 0 0; color: var(--muted); max-width: 72ch; }
      /* Extra notes have nowhere on the staff to be coloured -- nothing was
         written where you played -- so they get a lane of their own under the
         bar, placed from alphaTab's bounds the way the sticking letters are. */
      .extras span {
        position: absolute; transform: translateX(-50%);
        font: 700 12px/1 ui-monospace, "Cascadia Mono", Consolas, monospace;
        color: #d33; pointer-events: none; white-space: nowrap;
      }
      /* alphaTab creates the cursor elements but leaves them unstyled. */
      .at-cursor-bar { background: rgba(255, 200, 0, 0.18); }
      .at-cursor-beat { background: rgba(230, 60, 60, 0.85); width: 3px; }
      .at-highlight * { fill: #d33; stroke: #d33; }
    </style>
  </head>
  <body>
    <main>
      <div class="top">
        <div>
          <h1>drums-tabs</h1>
          <p class="sub">
            Notation from <code>songs/&lt;slug&gt;/tab.mid</code> on the song's own clock, synced to the drummer.
            <kbd>Space</kbd> play/pause &middot; <kbd>&larr;</kbd><kbd>&rarr;</kbd> a bar &middot; <kbd>&uarr;</kbd><kbd>&darr;</kbd> a line
            &middot; <kbd>Home</kbd> stop &middot; <kbd>[</kbd><kbd>]</kbd> tempo &middot; <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> mute a fader &middot; click the score to seek.
          </p>
        </div>
        <button id="theme" title="Switch theme" aria-label="Switch theme"></button>
      </div>
      <div class="controls">
        <label>
          Song
          <select id="song"></select>
        </label>
        <button id="play" disabled>Play</button>
        <button id="stop" disabled>Stop</button>
        <label>
          Tempo
          <input id="speed" type="range" min="25" max="125" value="100" step="5" />
          <output id="speed-out">100%</output>
        </label>
        <label>
          Lines
          <select id="lines">
            <option>1</option>
            <option selected>2</option>
            <option>3</option>
            <option>4</option>
            <!-- As many as the stage has room for: the default with no video. -->
            <option value="fit">Fill</option>
          </select>
        </label>
        <!-- Which hand plays what, from sticking.lock.json (`drums sticking`). -->
        <label title="R and L under the notation">
          <input id="sticking" type="checkbox" checked />
          Sticking
        </label>
        <!-- The mixer: what you hear is the two stems and the click, not the
             video's own soundtrack (that is the full mix). -->
        <div class="mixer">
          <label>
            No drums
            <input id="fader-nodrums" type="range" min="0" max="100" value="100" />
            <output id="fader-nodrums-out">100%</output>
          </label>
          <label>
            Drums
            <input id="fader-drums" type="range" min="0" max="100" value="100" />
            <output id="fader-drums-out">100%</output>
          </label>
          <label>
            Click
            <input id="fader-click" type="range" min="0" max="100" value="0" />
            <output id="fader-click-out">0%</output>
          </label>
        </div>
      </div>
      <!-- Practice mode: what you play, measured against what is written.
           Dev-mode only -- writing a take needs the dev server (plugins/practice.ts). -->
      <div class="controls practice">
        <button id="midi-enable">Enable MIDI</button>
        <label>
          Input
          <select id="midi-port" disabled></select>
        </label>
        <button id="calibrate" disabled title="Play steady quarters to the click">Calibrate</button>
        <output id="calibration">uncalibrated</output>
        <span class="grow"></span>
        <button id="record" disabled>Record</button>
        <output id="cell"></output>
        <label title="The last few hits, as they arrive">
          <input id="monitor-on" type="checkbox" />
          Monitor
        </label>
      </div>
      <div id="monitor" hidden></div>
      <!-- The routine: the fixed grid of cells one run walks (practice-plan
           Q5), and the run you are part-way through (Q10). It is a file on
           disk rewritten after every cell, so saving the Live set -- which
           reloads this page -- resumes where you were instead of losing it.
           Sealing is by hand: there is no clock on a routine. -->
      <div class="controls practice">
        <button id="routine-start">Start routine</button>
        <button id="routine-seal" hidden disabled>Seal routine</button>
        <button
          id="routine-discard"
          hidden
          title="Throw the run away. The takes it filled stay on disk."
        >
          Discard
        </button>
        <output id="routine-state" class="grow">no routine open</output>
      </div>
      <div id="routine" hidden></div>
      <!-- The master clock: audio/mix.wav, the timeline the beat map, the
           stems and the notation all refer to. Everything else on the page
           follows it. No controls: the transport is alphaTab's, and the mixer
           holds this element's own sound at 0 whenever the stems are playing. -->
      <audio id="mix" preload="auto"></audio>
      <div id="stage">
        <video id="video" playsinline preload="auto"></video>
        <div id="score-box"><div id="score"></div></div>
      </div>
      <!-- The take report: per-limb mean and spread, and the worst bars. The
           heatmap half of it is on the notation itself (heatmap.ts). -->
      <div id="report" hidden></div>
      <p id="status">Loading alphaTab&hellip;</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
