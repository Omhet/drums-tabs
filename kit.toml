# Your kit: where everything is, and what it costs to play it.
#
# This is a property of you and your kit, not of a song, so it lives here at
# the repo root rather than in any songs/<slug>/song.toml. `drums sticking`
# reads it to work out which hand plays what -- it only ever needs *relative*
# distances (is the ride further from the snare than the hi-hat is), so rough
# numbers are enough to get R and L right. Precision starts to matter only when
# a 3D stick has to visibly land on a drum, which is a later milestone; the
# body measurements and camera shots that milestone needs will arrive here too.
#
# Positions are in centimetres, looking down on the kit: the origin is the
# centre of the kick drum, +x is to your right, +y is away from the stool. The
# heights are not modelled -- from above, a cymbal and a drum are both a place
# to put a stick.
#
# `limbs` says who can reach it. Everything a hand can play is left to the
# solver; the two pedals are a lookup, not a search.

[instrument.kick]
pos = [0, 0]
limbs = ["right_foot"]

[instrument.hihat_pedal]
pos = [-50, -10]
limbs = ["left_foot"]

[instrument.snare]
pos = [-25, -15]
limbs = ["left_hand", "right_hand"]

[instrument.hihat_closed]
pos = [-50, -10]
limbs = ["left_hand", "right_hand"]

[instrument.hihat_open]
pos = [-50, -10]
limbs = ["left_hand", "right_hand"]

[instrument.tom_high]
pos = [-15, 25]
limbs = ["left_hand", "right_hand"]

[instrument.tom_mid]
pos = [15, 25]
limbs = ["left_hand", "right_hand"]

[instrument.tom_floor]
pos = [45, 5]
limbs = ["left_hand", "right_hand"]

[instrument.ride]
pos = [50, 20]
limbs = ["left_hand", "right_hand"]

[instrument.crash]
pos = [-45, 35]
limbs = ["left_hand", "right_hand"]

[instrument.crash2]
pos = [35, 40]
limbs = ["left_hand", "right_hand"]

# What "effort" means. There is one hard rule -- a hand cannot move faster than
# `max_speed_cm_s`, and a passage needing more is reported as unplayable rather
# than played badly -- and three preferences, which are taste and are meant to
# be tuned. Read the R and L letters under the notation, ask whether that is
# what you would play, and change a number here. Nothing needs rebuilding; just
# re-run `drums sticking --restick`.
#
# These first numbers were picked to be plausible and then tuned against one
# song, so treat them as a starting point rather than as settled.
[hands]
# Hard: the fastest a hand can travel between two instruments.
max_speed_cm_s = 700

# Which hand keeps time. On a right-handed kit the hi-hat is on your left and
# the right hand crosses over to reach it -- that is not a crossing to avoid,
# it is how the kit is played, so the lead hand is the one that gets the
# instruments marked `time_keeper` (the hats and the ride, unless you say
# otherwise) and the other hand gets the snare under it.
lead = "right"
# Soft: the cost of the other hand taking a time-keeper instead. High enough
# that grooves come out conventional, low enough that a fill can borrow it.
lead_bias = 2.5

# Soft: how much a rushed move costs, as a fraction of the speed limit used.
travel = 1.0
# Soft: the hands ending up on the wrong sides of each other, away from the
# time-keepers -- crossing over to the hats does not count, see `lead`.
crossover = 2.0
# Soft: the same hand twice in a row when there is no time for it. Fills
# alternate because one hand cannot keep up, and this is what makes the solver
# alternate too.
repeat = 1.5
# "No time for it" means a gap shorter than this.
repeat_below_ms = 260

# What your module sends, and which instrument each note means.
#
# This is the other half of a song's `[midi_map]`, and the two are easy to
# confuse because they are both "MIDI note -> instrument" and they disagree
# about almost every number. `[midi_map]` describes the **drum rack in
# Ableton** that the notation is authored on -- chromatic from 36, so 38 is
# the hi-hat. This describes the **module you actually hit**, which sends
# Roland's layout, where 38 is the snare head. Nothing translates between
# them: a take stores the raw numbers the module sent, and this table is what
# reads them as instruments for scoring.
#
# The numbers below are Roland's factory layout, shared by the TD-17/27/50.
# Do not trust them -- the practice panel lists every note it receives and
# says which are unmapped, so hit each pad once and fix whatever is wrong.
# Several notes map to one instrument on purpose: a rim shot and a head hit
# are both the snare as far as the chart is concerned, and the notation has no
# way to write the difference.
[input]
# Which MIDI port to open, matched as a case-insensitive substring of the
# port name. Empty means "ask", and the choice is remembered per browser.
port = "TD-27"

# One drum caught in two states, not two drums.
#
# A hi-hat module decides "open" or "closed" from where your foot is at the
# instant of the strike, and the threshold rarely matches where *you* think
# closed is -- so a normal closed groove sends a mixture. Scored literally that
# is a wrong note on every flicker, which buries the mistakes you actually
# made. Listed here, the pair is matched as one drum: you hit the right thing
# at the right time, and the report says separately how many landed on the
# other side of the threshold.
#
# This is not a way to excuse wrong drums. A tom where a snare is written stays
# wrong; only states of the same instrument belong here.
same_drum = [["hihat_closed", "hihat_open"]]

[input.note]
36 = "kick"           # kick
35 = "kick"           # kick, alternate

38 = "snare"          # snare head
40 = "snare"          # snare rim shot
37 = "snare"          # snare cross-stick

48 = "tom_high"       # tom 1 head
50 = "tom_high"       # tom 1 rim
45 = "tom_mid"        # tom 2 head
47 = "tom_mid"        # tom 2 rim
43 = "tom_floor"      # tom 3 head
58 = "tom_floor"      # tom 3 rim

42 = "hihat_closed"   # hi-hat bow, pedal down
22 = "hihat_closed"   # hi-hat edge, pedal down
46 = "hihat_open"     # hi-hat bow, pedal up
26 = "hihat_open"     # hi-hat edge, pedal up
44 = "hihat_pedal"    # hi-hat pedal, closed with the foot
21 = "hihat_pedal"    # hi-hat pedal splash

49 = "crash"          # crash 1 bow
55 = "crash"          # crash 1 edge
57 = "crash2"         # crash 2 bow
52 = "crash2"         # crash 2 edge

51 = "ride"           # ride bow
59 = "ride"           # ride edge
53 = "ride"           # ride bell
